<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <title>Abertura de Chamados</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <h1>Abertura de Chamado - Supermercado</h1>

    <form action="https://formsubmit.co/joaopaulo.junqueira.ti@gmail.com" method="POST">
        <!-- Campos escondidos -->
        <input type="hidden" name="_subject" value="Chamado aberto pelo caixa">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_next" value="obrigado.html">

        <label for="filial">Filial</label>
        <select name="filial" id="filial" required></select>

        <label for="caixa">Número do Caixa:</label>
        <select name="caixa" id="caixa" required>
            <option value="">Selecione</option>
        </select>

        <label for="descricao">Descreva o Problema:</label>
        <textarea name="descricao" id="descricao" rows="4" required></textarea>

        <button type="submit">Abrir Chamado</button>
    </form>

    <audio id="somSucesso" src="check-mark_oPG7Xo5.mp3" preload="auto"></audio>


</body>
    <script src="index.js"></script>
</html>
